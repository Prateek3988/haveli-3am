<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HAVELI — 3 AM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000; color: #c00;
    font-family: 'Courier New', monospace;
    height: 100vh; width: 100vw;
    overflow: hidden; user-select: none; position: fixed;
  }
  #game {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 20px;
  }
  #game.shake { animation: shake 0.5s infinite; }

  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-8px, 4px); }
    50% { transform: translate(6px, -6px); }
    75% { transform: translate(-4px, -8px); }
  }

  #audioStatus {
    position: absolute; top: 15px; right: 15px;
    font-size: 0.7em; letter-spacing: 2px;
    padding: 6px 12px; border-radius: 3px;
    border: 1px solid #333; color: #666;
    z-index: 100; transition: all 0.3s;
  }
  #audioStatus.on { color: #0f0; border-color: #0f0; box-shadow: 0 0 10px #0f0; }

  #intro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10; transition: opacity 1.5s ease;
  }
  #intro.fade-out { opacity: 0; pointer-events: none; }
  #intro h1 {
    font-size: 4em; letter-spacing: 14px; color: #8b0000;
    text-shadow: 0 0 20px #f00, 0 0 60px #500;
    animation: pulse 3s ease-in-out infinite;
  }
  #intro .sub { margin-top: 20px; font-size: 0.9em; color: #666; letter-spacing: 4px; }
  #intro .tap {
    margin-top: 80px; font-size: 1.1em; color: #aaa; letter-spacing: 3px;
    animation: blink 1.5s ease-in-out infinite;
    cursor: pointer; padding: 15px 40px;
    border: 1px solid #500; border-radius: 4px;
    background: rgba(255,0,0,0.05);
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 20px #f00, 0 0 60px #500; }
    50% { text-shadow: 0 0 40px #f00, 0 0 100px #900; }
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  #scene {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1.5s ease;
    padding: 30px;
  }
  #scene.show { display: flex; opacity: 1; }

  #timeLabel {
    font-size: 2em; color: #f00; letter-spacing: 8px;
    text-shadow: 0 0 20px #f00, 0 0 50px #900;
    animation: flicker 4s infinite;
    margin-bottom: 30px;
  }
  @keyframes flicker {
    0%,18%,22%,25%,53%,57%,100%{opacity:1;}
    20%,24%,55%{opacity:0.3;} 21%{opacity:0.6;}
  }

  #storyText {
    font-size: 1.1em; color: #aaa;
    letter-spacing: 2px; line-height: 2;
    max-width: 500px; text-align: center;
    min-height: 120px;
    margin-bottom: 30px;
  }
  #storyText .line {
    display: block; opacity: 0;
    animation: fadeInLine 2s forwards;
  }
  #storyText .line:nth-child(1) { animation-delay: 0.3s; }
  #storyText .line:nth-child(2) { animation-delay: 2s; }
  #storyText .line:nth-child(3) { animation-delay: 4s; }
  #storyText .line:nth-child(4) { animation-delay: 6.5s; }
  @keyframes fadeInLine { to { opacity: 1; } }

  #choices {
    display: none; flex-direction: column;
    gap: 15px; margin-top: 20px;
    opacity: 0;
    animation: fadeInLine 1.5s forwards;
    animation-delay: 0.5s;
  }
  #choices.show { display: flex; }

  .choice {
    padding: 16px 30px;
    font-family: 'Courier New', monospace;
    font-size: 1em; letter-spacing: 2px;
    color: #ccc;
    background: rgba(255,255,255,0.03);
    border: 1px solid #444;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.3s;
    min-width: 260px;
  }
  .choice:hover, .choice:active {
    background: rgba(255,0,0,0.15);
    border-color: #900; color: #fff;
    box-shadow: 0 0 15px rgba(255,0,0,0.3);
  }

  #scare {
    position: fixed; inset: 0;
    display: none;
    justify-content: center; align-items: center;
    background: #000; z-index: 999;
  }
  #scare.show { display: flex; }

  #scareFace {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #300 0%, #000 70%);
    display: flex; justify-content: center; align-items: center;
    animation: scareZoom 0.3s ease-out;
  }
  @keyframes scareZoom {
    from { transform: scale(3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  #scareFace .ghost {
    font-size: 12em; color: #f00;
    text-shadow: 0 0 40px #f00, 0 0 80px #900, 0 0 120px #500;
    animation: ghostPulse 0.15s infinite;
    line-height: 1;
  }
  @keyframes ghostPulse {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.15) rotate(2deg); }
  }

  #scareFace .msg {
    position: absolute; bottom: 60px;
    font-size: 1.3em; color: #f00;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #f00;
    animation: blink 0.6s infinite;
  }
</style>
</head>
<body>

<div id="audioStatus">🔇 AUDIO OFF</div>

<div id="game">
  <div id="intro">
    <h1>HAVELI</h1>
    <div class="sub">— 3 A M —</div>
    <div class="tap" id="tapBtn">TAP TO BEGIN</div>
  </div>

  <div id="scene">
    <div id="timeLabel">3:00 AM</div>
    <div id="storyText"></div>
    <div id="choices"></div>
  </div>
</div>

<div id="scare">
  <div id="scareFace">
    <div class="ghost">👁️</div>
    <div class="msg">YOU SHOULD HAVE HIDDEN</div>
  </div>
</div>

<script>
  const statusBadge = document.getElementById('audioStatus');
  const gameEl = document.getElementById('game');
  const storyText = document.getElementById('storyText');
  const choicesEl = document.getElementById('choices');
  const scareEl = document.getElementById('scare');
  let audioCtx = null;
  let heartTimer = null;
  let heartbeatRate = 1200;
  let heartbeatVol = 0.3;
  let convolver = null;

  // ============================================
  // REVERB — gives the whole game a "haunted haveli" feel
  // ============================================
  function createReverb(ctx) {
    const duration = 2.5;
    const decay = 2.5;
    const rate = ctx.sampleRate;
    const length = rate * duration;
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/length, decay);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    return conv;
  }

  // ============================================
  // AUDIO ENGINE
  // ============================================
  function createWind(ctx) {
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 500;
    filter.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.value = 0.22;
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.1;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.13;
    lfo.connect(lfoGain).connect(gain.gain);
    lfo.start();
    return gain;
  }

  function thump(ctx, time, vol, freq1, freq2) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq1, time);
    osc.frequency.exponentialRampToValueAtTime(freq2, time + 0.15);
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(g).connect(ctx.destination);
    osc.start(time); osc.stop(time + 0.25);
  }

  function playHeartbeat(ctx) {
    const t = ctx.currentTime;
    thump(ctx, t, heartbeatVol, 80, 40);
    thump(ctx, t + 0.25, heartbeatVol * 0.6, 75, 35);
  }

  function startHeartbeat() {
    if (heartTimer) clearInterval(heartTimer);
    playHeartbeat(audioCtx);
    heartTimer = setInterval(() => playHeartbeat(audioCtx), heartbeatRate);
  }

  // ============================================
  // ✨ REAL PAYAL — metallic jingling bells
  // ============================================
  // Each strike = a tiny metallic bell with inharmonic partials + shimmer decay
  // Multiple bells clustered per step (like real payal has many ghungroos)
  function strikeBell(ctx, time, vol, baseFreq) {
    // Real bell = multiple inharmonic partials, not a pure tone
    const partials = [
      { ratio: 1.0,  vol: 1.0,  decay: 0.35 },
      { ratio: 2.76, vol: 0.55, decay: 0.22 }, // characteristic bell partial
      { ratio: 5.4,  vol: 0.35, decay: 0.15 },
      { ratio: 8.9,  vol: 0.2,  decay: 0.1  },
      { ratio: 13.3, vol: 0.1,  decay: 0.06 }
    ];
    partials.forEach(p => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = baseFreq * p.ratio;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(vol * p.vol * 0.4, time + 0.003); // sharp attack
      g.gain.exponentialRampToValueAtTime(0.0001, time + p.decay + 0.3);
      osc.connect(g);
      // Route through reverb for that haveli echo
      if (convolver) {
        g.connect(convolver);
        const dry = ctx.createGain();
        dry.gain.value = 0.6;
        g.connect(dry).connect(ctx.destination);
      } else {
        g.connect(ctx.destination);
      }
      osc.start(time);
      osc.stop(time + p.decay + 0.4);
    });
  }

  // A "step" = 6-10 tiny bells shaking together (like walking)
  function payalStep(ctx, time, foot, isLeft) {
    // Slight variation per step so it feels human
    const baseFreq = isLeft ? 2600 : 2900;
    const bellCount = 7 + Math.floor(Math.random() * 4); // 7-10 bells
    for (let i = 0; i < bellCount; i++) {
      // Each ghungroo has a slightly different pitch
      const freq = baseFreq + (Math.random() - 0.5) * 800;
      // Micro timing jitter — bells don't ring in perfect sync
      const offset = Math.random() * 0.06;
      // Volume varies per bell
      const vol = 0.10 + Math.random() * 0.08;
      strikeBell(ctx, time + offset, vol, freq);
    }
  }

  // Walking pattern: left-right-left-right with natural timing
  function playPayal(ctx) {
    const start = ctx.currentTime + 0.1;
    // 6 steps of a slow walk, slight timing irregularity
    const steps = [0, 0.62, 1.25, 1.85, 2.48, 3.12];
    steps.forEach((offset, i) => {
      const jitter = (Math.random() - 0.5) * 0.06;
      payalStep(ctx, start + offset + jitter, i, i % 2 === 0);
    });
  }

  function playKnock(ctx) {
    [0, 0.4, 0.8].forEach(delay => {
      const t = ctx.currentTime + delay;
      thump(ctx, t, 0.5, 120, 40);
    });
  }

  function playScream(ctx) {
    const dur = 1.8;
    const bufferSize = ctx.sampleRate * dur;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(2000, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + dur);
    filter.Q.value = 3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.6, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(); src.stop(ctx.currentTime + dur);
  }

  function beep(ctx) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(g).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  }

  // ============================================
  // START
  // ============================================
  function startAmbient() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      convolver = createReverb(audioCtx);
      convolver.connect(audioCtx.destination);
      beep(audioCtx);
      createWind(audioCtx);
      statusBadge.textContent = '🔊 AUDIO ON';
      statusBadge.classList.add('on');
    } catch(e) { console.log(e); }
  }

  // ============================================
  // STORY ENGINE
  // ============================================
  function showLines(lines, delay, callback) {
    storyText.innerHTML = '';
    lines.forEach((line, i) => {
      const el = document.createElement('span');
      el.className = 'line';
      el.textContent = line;
      el.style.animationDelay = (i * delay) + 's';
      storyText.appendChild(el);
    });
    if (callback) setTimeout(callback, lines.length * delay * 1000 + 500);
  }

  function showChoices(choices) {
    choicesEl.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = c.label;
      btn.addEventListener('click', c.action);
      choicesEl.appendChild(btn);
    });
    choicesEl.classList.add('show');
  }

  function hideChoices() {
    choicesEl.classList.remove('show');
    choicesEl.innerHTML = '';
  }

  // ============================================
  // SCENES
  // ============================================
  const scene = document.getElementById('scene');

  function sceneIntroStory() {
    showLines([
      'You wake up.',
      'The clock says 3:00 AM.',
      'Something feels wrong.',
      'You hear something outside your door...'
    ], 1.8, () => {
      playPayal(audioCtx);
      heartbeatRate = 900;
      heartbeatVol = 0.35;
      startHeartbeat();
      setTimeout(() => {
        showLines(['The anklets... someone is walking.', 'They stop right outside.'], 2, () => {
          showChoices([
            { label: '🔍 LOOK THROUGH THE DOOR', action: choiceLook },
            { label: '🛏️ HIDE UNDER THE BED', action: choiceHide }
          ]);
        });
      }, 5000);
    });
  }

  function choiceLook() {
    hideChoices();
    showLines(['You creep to the door.', 'You peek through the crack...'], 1.8, () => {
      setTimeout(triggerScare, 2000);
    });
  }

  function choiceHide() {
    hideChoices();
    showLines([
      'You slide under the bed.',
      'The anklets stop... right outside.',
      'The door creaks open.'
    ], 1.8, () => {
      showLines([
        'A pair of feet appear.',
        'They face the wrong way.',
        '— To be continued —'
      ], 2, null);
    });
  }

  function triggerScare() {
    playScream(audioCtx);
    gameEl.classList.add('shake');
    scareEl.classList.add('show');
    const buzz = audioCtx.createOscillator();
    const buzzG = audioCtx.createGain();
    buzz.type = 'sawtooth';
    buzz.frequency.value = 60;
    buzzG.gain.value = 0.3;
    buzz.connect(buzzG).connect(audioCtx.destination);
    buzz.start();
    buzz.stop(audioCtx.currentTime + 2.5);
    setTimeout(() => {
      gameEl.classList.remove('shake');
      scareEl.classList.remove('show');
      showLines(['You died.', 'The chudail found you.', '— GAME OVER —', 'Refresh to try again.'], 2, null);
    }, 3500);
  }

  const tapBtn = document.getElementById('tapBtn');
  const intro = document.getElementById('intro');
  tapBtn.addEventListener('click', () => {
    startAmbient();
    intro.classList.add('fade-out');
    setTimeout(() => {
      scene.classList.add('show');
      setTimeout(sceneIntroStory, 1500);
    }, 1200);
  });
</script>

</body>
</html>
