<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>HAVELI — 3 AM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #000; color: #c00;
    font-family: 'Courier New', monospace;
    height: 100vh; width: 100vw;
    overflow: hidden; user-select: none; position: fixed;
  }
  #game {
    position: relative; width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 20px;
  }
  #game.shake { animation: shake 0.5s infinite; }
  @keyframes shake {
    0%,100% { transform: translate(0,0); }
    25% { transform: translate(-8px, 4px); }
    50% { transform: translate(6px, -6px); }
    75% { transform: translate(-4px, -8px); }
  }

  #audioStatus {
    position: absolute; top: 15px; right: 15px;
    font-size: 0.7em; letter-spacing: 2px;
    padding: 6px 12px; border-radius: 3px;
    border: 1px solid #333; color: #666;
    z-index: 100; transition: all 0.3s;
  }
  #audioStatus.on { color: #0f0; border-color: #0f0; box-shadow: 0 0 10px #0f0; }

  #intro {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 10; transition: opacity 1.5s ease;
  }
  #intro.fade-out { opacity: 0; pointer-events: none; }
  #intro h1 {
    font-size: 4em; letter-spacing: 14px; color: #8b0000;
    text-shadow: 0 0 20px #f00, 0 0 60px #500;
    animation: pulse 3s ease-in-out infinite;
  }
  #intro .sub { margin-top: 20px; font-size: 0.9em; color: #666; letter-spacing: 4px; }
  #intro .tap {
    margin-top: 80px; font-size: 1.1em; color: #aaa; letter-spacing: 3px;
    animation: blink 1.5s ease-in-out infinite;
    cursor: pointer; padding: 15px 40px;
    border: 1px solid #500; border-radius: 4px;
    background: rgba(255,0,0,0.05);
  }
  @keyframes pulse {
    0%,100% { text-shadow: 0 0 20px #f00, 0 0 60px #500; }
    50% { text-shadow: 0 0 40px #f00, 0 0 100px #900; }
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

  #scene {
    position: absolute; inset: 0;
    display: none; flex-direction: column;
    justify-content: center; align-items: center;
    opacity: 0; transition: opacity 1.5s ease;
    padding: 30px;
  }
  #scene.show { display: flex; opacity: 1; }

  #timeLabel {
    font-size: 1.6em; color: #f00; letter-spacing: 8px;
    text-shadow: 0 0 20px #f00, 0 0 50px #900;
    animation: flicker 4s infinite;
    margin-bottom: 25px;
  }
  @keyframes flicker {
    0%,18%,22%,25%,53%,57%,100%{opacity:1;}
    20%,24%,55%{opacity:0.3;} 21%{opacity:0.6;}
  }

  #storyText {
    font-size: 1.1em; color: #bbb;
    letter-spacing: 2px; line-height: 2.2;
    max-width: 500px; text-align: center;
    min-height: 160px; margin-bottom: 25px;
  }
  #storyText .line { display: block; min-height: 2em; }

  #choices {
    display: none; flex-direction: column;
    gap: 14px; margin-top: 15px;
  }
  #choices.show { display: flex; }

  .choice {
    padding: 15px 28px;
    font-family: 'Courier New', monospace;
    font-size: 0.95em; letter-spacing: 2px;
    color: #ccc;
    background: rgba(255,255,255,0.03);
    border: 1px solid #444;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.3s;
    min-width: 260px;
  }
  .choice:hover, .choice:active {
    background: rgba(255,0,0,0.15);
    border-color: #900; color: #fff;
    box-shadow: 0 0 15px rgba(255,0,0,0.3);
  }

  #scare {
    position: fixed; inset: 0;
    display: none; justify-content: center; align-items: center;
    background: #000; z-index: 999;
  }
  #scare.show { display: flex; }
  #scareFace {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse at center, #300 0%, #000 70%);
    display: flex; justify-content: center; align-items: center;
    animation: scareZoom 0.3s ease-out;
  }
  @keyframes scareZoom {
    from { transform: scale(3); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  #scareFace .ghost {
    font-size: 12em; color: #f00;
    text-shadow: 0 0 40px #f00, 0 0 80px #900, 0 0 120px #500;
    animation: ghostPulse 0.15s infinite;
    line-height: 1;
  }
  @keyframes ghostPulse {
    0%,100% { transform: scale(1) rotate(-2deg); }
    50% { transform: scale(1.15) rotate(2deg); }
  }
  #scareFace .msg {
    position: absolute; bottom: 60px;
    font-size: 1.3em; color: #f00;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #f00;
    animation: blink 0.6s infinite;
  }

  #ending {
    position: fixed; inset: 0;
    display: none; flex-direction: column;
    justify-content: center; align-items: center;
    background: #000; z-index: 998;
    padding: 30px; text-align: center;
  }
  #ending.show { display: flex; }
  #ending .tag {
    font-size: 1.6em; color: #f00;
    letter-spacing: 6px;
    text-shadow: 0 0 20px #f00;
    margin-bottom: 30px;
    animation: blink 1.5s infinite;
  }
  #ending .desc {
    font-size: 1.1em; color: #888;
    letter-spacing: 2px; line-height: 2;
    max-width: 500px; margin-bottom: 50px;
  }
  #replay {
    padding: 18px 40px;
    font-family: 'Courier New', monospace;
    font-size: 1em; letter-spacing: 3px;
    color: #fff;
    background: rgba(255,0,0,0.15);
    border: 1px solid #900;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,0,0,0.3);
  }
  #replay:active { background: rgba(255,0,0,0.4); }

  .cursor::after {
    content: '▌'; color: #f00;
    animation: blink 0.7s infinite; margin-left: 2px;
  }
</style>
</head>
<body>

<div id="audioStatus">🔇 AUDIO OFF</div>

<div id="game">
  <div id="intro">
    <h1>HAVELI</h1>
    <div class="sub">— 3 A M —</div>
    <div class="tap" id="tapBtn">TAP TO BEGIN</div>
  </div>

  <div id="scene">
    <div id="timeLabel">3:00 AM</div>
    <div id="storyText"></div>
    <div id="choices"></div>
  </div>
</div>

<div id="scare">
  <div id="scareFace">
    <div class="ghost">👁️</div>
    <div class="msg" id="scareMsg">YOU SHOULD HAVE HIDDEN</div>
  </div>
</div>

<div id="ending">
  <div class="tag" id="endingTag"></div>
  <div class="desc" id="endingDesc"></div>
  <button id="replay">PLAY AGAIN</button>
</div>

<script>
  const statusBadge = document.getElementById('audioStatus');
  const gameEl = document.getElementById('game');
  const storyText = document.getElementById('storyText');
  const choicesEl = document.getElementById('choices');
  const scareEl = document.getElementById('scare');
  const scareMsg = document.getElementById('scareMsg');
  const endingEl = document.getElementById('ending');
  const endingTag = document.getElementById('endingTag');
  const endingDesc = document.getElementById('endingDesc');
  const replayBtn = document.getElementById('replay');

  let audioCtx = null;
  let heartTimer = null;
  let heartbeatRate = 1200;
  let heartbeatVol = 0.3;
  let convolver = null;
  let typewriterTimers = [];

  function createReverb(ctx) {
    const duration = 3.0, decay = 2.5;
    const rate = ctx.sampleRate;
    const length = rate * duration;
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
      const d = impulse.getChannelData(ch);
      for (let i = 0; i < length; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i/length, decay);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = impulse;
    return conv;
  }

  function createWind(ctx) {
    const bufferSize = ctx.sampleRate * 2;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buffer; noise.loop = true;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 500; filter.Q.value = 0.7;
    const gain = ctx.createGain(); gain.gain.value = 0.22;
    noise.connect(filter).connect(gain).connect(ctx.destination);
    noise.start();
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 0.1;
    const lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.13;
    lfo.connect(lfoGain).connect(gain.gain);
    lfo.start();
  }

  function thump(ctx, time, vol, freq1, freq2) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq1, time);
    osc.frequency.exponentialRampToValueAtTime(freq2, time + 0.15);
    g.gain.setValueAtTime(vol, time);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
    osc.connect(g).connect(ctx.destination);
    osc.start(time); osc.stop(time + 0.25);
  }
  function playHeartbeat(ctx) {
    const t = ctx.currentTime;
    thump(ctx, t, heartbeatVol, 80, 40);
    thump(ctx, t + 0.25, heartbeatVol * 0.6, 75, 35);
  }
  function startHeartbeat() {
    if (heartTimer) clearInterval(heartTimer);
    playHeartbeat(audioCtx);
    heartTimer = setInterval(() => playHeartbeat(audioCtx), heartbeatRate);
  }
  function stopHeartbeat() { if (heartTimer) { clearInterval(heartTimer); heartTimer = null; } }

  function footstep(ctx, time, vol, pitchMod) {
    const thudOsc = ctx.createOscillator();
    const thudGain = ctx.createGain();
    thudOsc.type = 'sine';
    thudOsc.frequency.setValueAtTime(90 * pitchMod, time);
    thudOsc.frequency.exponentialRampToValueAtTime(40 * pitchMod, time + 0.12);
    thudGain.gain.setValueAtTime(vol * 0.5, time);
    thudGain.gain.exponentialRampToValueAtTime(0.001, time + 0.18);
    thudOsc.connect(thudGain);
    if (convolver) {
      thudGain.connect(convolver);
      const dry = ctx.createGain(); dry.gain.value = 0.5;
      thudGain.connect(dry).connect(ctx.destination);
    } else { thudGain.connect(ctx.destination); }
    thudOsc.start(time); thudOsc.stop(time + 0.25);

    const creakDur = 0.12;
    const bufSize = Math.floor(ctx.sampleRate * creakDur);
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      const env = 1 - (i/bufSize);
      d[i] = (Math.random() * 2 - 1) * env * 0.5;
    }
    const creak = ctx.createBufferSource();
    creak.buffer = buf;
    const creakFilter = ctx.createBiquadFilter();
    creakFilter.type = 'bandpass';
    creakFilter.frequency.value = 800 * pitchMod + Math.random() * 400;
    creakFilter.Q.value = 8;
    const creakGain = ctx.createGain();
    creakGain.gain.value = vol * 0.15;
    creak.connect(creakFilter).connect(creakGain);
    if (convolver) {
      creakGain.connect(convolver);
      const dry2 = ctx.createGain(); dry2.gain.value = 0.6;
      creakGain.connect(dry2).connect(ctx.destination);
    } else { creakGain.connect(ctx.destination); }
    creak.start(time); creak.stop(time + creakDur);
  }

  function playFootsteps(ctx) {
    const start = ctx.currentTime + 0.1;
    const steps = [0, 0.72, 1.44, 2.16, 2.88, 3.60];
    steps.forEach((offset, i) => {
      const jitter = (Math.random() - 0.5) * 0.06;
      const volume = 0.5 + i * 0.15;
      const pitch = 1.0 + i * 0.05;
      footstep(ctx, start + offset + jitter, volume, pitch);
    });
  }

  function laughBurst(ctx, time, duration, baseFreq, isDescending) {
    const formants = [700, 1100];
    formants.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      osc.type = idx === 0 ? 'sawtooth' : 'sine';
      osc.frequency.setValueAtTime(baseFreq, time);
      if (isDescending) {
        osc.frequency.linearRampToValueAtTime(baseFreq * 0.75, time + duration);
      } else {
        osc.frequency.linearRampToValueAtTime(baseFreq * 1.05, time + duration);
      }
      const formantFilter = ctx.createBiquadFilter();
      formantFilter.type = 'bandpass';
      formantFilter.frequency.value = freq;
      formantFilter.Q.value = 5;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, time);
      g.gain.linearRampToValueAtTime(0.15, time + 0.02);
      g.gain.linearRampToValueAtTime(0.15, time + duration - 0.05);
      g.gain.exponentialRampToValueAtTime(0.001, time + duration);
      osc.connect(formantFilter).connect(g);
      if (convolver) {
        g.connect(convolver);
        const dry = ctx.createGain(); dry.gain.value = 0.4;
        g.connect(dry).connect(ctx.destination);
      } else { g.connect(ctx.destination); }
      osc.start(time); osc.stop(time + duration + 0.1);
    });

    const breathDur = duration;
    const bufSize = Math.floor(ctx.sampleRate * breathDur);
    const buf = ctx.createBuffer(1, bufSize, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      const env = Math.sin((i/bufSize) * Math.PI);
      d[i] = (Math.random() * 2 - 1) * env * 0.4;
    }
    const breath = ctx.createBufferSource();
    breath.buffer = buf;
    const bFilter = ctx.createBiquadFilter();
    bFilter.type = 'bandpass'; bFilter.frequency.value = 1800; bFilter.Q.value = 2;
    const bGain = ctx.createGain(); bGain.gain.value = 0.08;
    breath.connect(bFilter).connect(bGain);
    if (convolver) {
      bGain.connect(convolver);
      const dryB = ctx.createGain(); dryB.gain.value = 0.3;
      bGain.connect(dryB).connect(ctx.destination);
    } else { bGain.connect(ctx.destination); }
    breath.start(time); breath.stop(time + breathDur);
  }

  function playLaugh(ctx, intensity) {
    const start = ctx.currentTime + 0.15;
    const pattern = [
      { t: 0.0,  dur: 0.18, freq: 280, desc: true },
      { t: 0.35, dur: 0.15, freq: 300, desc: true },
      { t: 0.75, dur: 0.12, freq: 320, desc: false },
      { t: 0.92, dur: 0.12, freq: 310, desc: false },
      { t: 1.09, dur: 0.12, freq: 330, desc: false },
      { t: 1.26, dur: 0.12, freq: 340, desc: false },
      { t: 1.55, dur: 0.55, freq: 260, desc: true }
    ];
    pattern.forEach(p => {
      laughBurst(ctx, start + p.t, p.dur, p.freq, p.desc);
    });
  }

  function playWhisper(ctx) {
    const dur = 1.6;
    const bufferSize = ctx.sampleRate * dur;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      const env = Math.sin((i/bufferSize) * Math.PI);
      data[i] = (Math.random() * 2 - 1) * env * 0.8;
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1200; filter.Q.value = 4;
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.connect(filter).connect(g);
    if (convolver) {
      g.connect(convolver);
      const dry = ctx.createGain(); dry.gain.value = 0.4;
      g.connect(dry).connect(ctx.destination);
    } else { g.connect(ctx.destination); }
    src.start(); src.stop(ctx.currentTime + dur);
  }

  function playScream(ctx) {
    const dur = 1.8;
    const bufferSize = ctx.sampleRate * dur;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
    }
    const src = ctx.createBufferSource(); src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(2000, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + dur);
    filter.Q.value = 3;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.6, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(filter).connect(g).connect(ctx.destination);
    src.start(); src.stop(ctx.currentTime + dur);
  }

  function playCrack(ctx) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(3000, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.3);
    g.gain.setValueAtTime(0.5, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(g).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
  }

  function beep(ctx) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
    osc.connect(g).connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.3);
  }

  function startAmbient() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      convolver = createReverb(audioCtx);
      convolver.connect(audioCtx.destination);
      beep(audioCtx);
      createWind(audioCtx);
      statusBadge.textContent = '🔊 AUDIO ON';
      statusBadge.classList.add('on');
    } catch(e) { console.log(e); }
  }

  function clearTimers() {
    typewriterTimers.forEach(t => clearTimeout(t));
    typewriterTimers = [];
  }
  function typeLine(text, delay, speed, callback) {
    const el = document.createElement('span');
    el.className = 'line cursor';
    storyText.appendChild(el);
    let i = 0;
    const t = setTimeout(() => {
      const typer = setInterval(() => {
        if (i < text.length) { el.textContent = text.slice(0, i + 1); i++; }
        else { clearInterval(typer); el.classList.remove('cursor'); if (callback) callback(); }
      }, speed);
      typewriterTimers.push(typer);
    }, delay);
    typewriterTimers.push(t);
  }
  function showLines(lines, delay, speed, callback) {
    storyText.innerHTML = '';
    clearTimers();
    let totalDelay = delay * 1000;
    lines.forEach((line, idx) => {
      const isLast = idx === lines.length - 1;
      typeLine(line, totalDelay, speed, isLast ? callback : null);
      totalDelay += line.length * speed + delay * 1000;
    });
  }
  function showChoices(choices) {
    choicesEl.innerHTML = '';
    choices.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'choice';
      btn.textContent = c.label;
      btn.addEventListener('click', c.action);
      choicesEl.appendChild(btn);
    });
    choicesEl.classList.add('show');
  }
  function hideChoices() { choicesEl.classList.remove('show'); choicesEl.innerHTML = ''; }

  function triggerScare(emoji, msg, then) {
    playScream(audioCtx);
    gameEl.classList.add('shake');
    scareEl.querySelector('.ghost').textContent = emoji;
    scareMsg.textContent = msg;
    scareEl.classList.add('show');
    const buzz = audioCtx.createOscillator();
    const buzzG = audioCtx.createGain();
    buzz.type = 'sawtooth'; buzz.frequency.value = 60; buzzG.gain.value = 0.3;
    buzz.connect(buzzG).connect(audioCtx.destination);
    buzz.start(); buzz.stop(audioCtx.currentTime + 2.5);
    setTimeout(() => {
      gameEl.classList.remove('shake');
      scareEl.classList.remove('show');
      if (then) then();
    }, 3200);
  }
  function showEnding(tag, desc) {
    stopHeartbeat();
    endingTag.textContent = tag;
    endingDesc.innerHTML = desc;
    endingEl.classList.add('show');
  }

  const scene = document.getElementById('scene');

  function sceneIntroStory() {
    showLines([
      'You wake up.',
      'The clock says 3:00 AM.',
      'Something feels wrong.',
      'You hear footsteps outside...'
    ], 0.8, 45, () => {
      playFootsteps(audioCtx);
      heartbeatRate = 900; heartbeatVol = 0.35;
      startHeartbeat();
      setTimeout(() => {
        showLines(['The footsteps stop.', 'Right outside the door.'], 0.7, 45, () => {
          setTimeout(() => {
            playLaugh(audioCtx, 1);
            setTimeout(() => {
              showChoices([
                { label: '🔍 LOOK THROUGH THE DOOR', action: choiceLook },
                { label: '🛏️ HIDE UNDER THE BED', action: choiceHide }
              ]);
            }, 3500);
          }, 1500);
        });
      }, 5500);
    });
  }

  function choiceLook() {
    hideChoices();
    showLines(['You creep to the door.', 'You peek through the crack...'], 0.7, 45, () => {
      setTimeout(() => {
        playLaugh(audioCtx, 1.3);
        setTimeout(() => {
          triggerScare('😈', 'SHE SAW YOU', () => {
            showEnding('💀 DEATH BY EYE', 'The chudail was already looking back at you. Her laugh echoed down the corridor.<br><br>You never stopped hearing it.');
          });
        }, 2000);
      }, 1800);
    });
  }

  function choiceHide() {
    hideChoices();
    showLines([
      'You slide under the bed.',
      'The footsteps stop...',
      'Right outside the door.',
      'The door creaks open.'
    ], 0.7, 40, () => {
      heartbeatRate = 700;
      playWhisper(audioCtx);
      setTimeout(() => {
        showLines(['A pair of feet appear.', 'They face the wrong way.'], 0.9, 50, () => {
          setTimeout(() => {
            playLaugh(audioCtx, 0.9);
            setTimeout(() => {
              showChoices([
                { label: '👣 FOLLOW THE FEET', action: endingFeet },
                { label: '🪞 CRAWL TO THE MIRROR', action: endingMirror },
                { label: '🕯️ LIGHT A CANDLE', action: endingCandle }
              ]);
            }, 3000);
          }, 500);
        });
      }, 2500);
    });
  }

  function endingFeet() {
    hideChoices();
    showLines(['You crawl slowly.', 'You reach for her ankle...'], 0.8, 45, () => {
      setTimeout(() => {
        playFootsteps(audioCtx);
        setTimeout(() => {
          playLaugh(audioCtx, 1.5);
          setTimeout(() => {
            triggerScare('👣', 'THE FEET TURNED', () => {
              showEnding('💀 THE WRONG FEET', 'Her feet faced backwards. She was looking at you the whole time.<br><br>She kept laughing.');
            });
          }, 1500);
        }, 4200);
      }, 1800);
    });
  }

  function endingMirror() {
    hideChoices();
    showLines(['You crawl to the mirror.', 'Your reflection is... wrong.'], 0.8, 50, () => {
      setTimeout(() => {
        playCrack(audioCtx);
        setTimeout(() => {
          playLaugh(audioCtx, 1.2);
          setTimeout(() => {
            triggerScare('🪞', 'THE MIRROR BROKE', () => {
              showEnding('💀 THE MIRROR', 'Your reflection grabbed you from inside the glass. She wore your face.<br><br>The mirror still shows her, waiting.');
            });
          }, 2000);
        }, 1500);
      }, 1500);
    });
  }

  function endingCandle() {
    hideChoices();
    showLines(['You reach for the candle.', 'You light it.', 'The room is empty.'], 0.8, 45, () => {
      playWhisper(audioCtx);
      setTimeout(() => {
        showLines(['But the flame...', 'It is standing still.', 'And it is laughing.'], 0.8, 50, () => {
          setTimeout(() => {
            playLaugh(audioCtx, 1.4);
            setTimeout(() => {
              triggerScare('🕯️', 'SHE WAS THE FLAME', () => {
                showEnding('🏃 YOU ESCAPED?', 'You blew out the candle and ran. You never looked back.<br><br>But every night at 3 AM, you still hear her laugh.<br><br>⭐⭐ <strong>Best ending</strong> ⭐⭐');
              });
            }, 2000);
          }, 2200);
        });
      }, 2500);
    });
  }

  const tapBtn = document.getElementById('tapBtn');
  const intro = document.getElementById('intro');

  function startGame() {
    startAmbient();
    intro.classList.add('fade-out');
    setTimeout(() => {
      scene.classList.add('show');
      setTimeout(sceneIntroStory, 1500);
    }, 1200);
  }

  tapBtn.addEventListener('click', startGame);
  tapBtn.addEventListener('touchstart', startGame);

  replayBtn.addEventListener('click', () => {
    endingEl.classList.remove('show');
    storyText.innerHTML = '';
    hideChoices();
    clearTimers();
    stopHeartbeat();
    heartbeatRate = 1200;
    heartbeatVol = 0.3;
    setTimeout(() => {
      sceneIntroStory();
    }, 500);
  });
</script>

</body>
</html>
